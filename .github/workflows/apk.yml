name: Construire l'application Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier la cle de signature
        run: |
          if [ ! -f taxi-pro.keystore ]; then echo "ERREUR : le fichier taxi-pro.keystore est absent du depot."; exit 1; fi
          keytool -list -keystore taxi-pro.keystore -storepass android | tail -3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparer le projet Capacitor
        run: |
          mkdir build && cd build
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/local-notifications@7 @capacitor-community/background-geolocation@1.3.1
          python3 - <<'PYSHARE'
          import re
          f = 'node_modules/@capacitor/share/android/src/main/java/com/capacitorjs/plugins/share/SharePlugin.java'
          t = open(f, encoding='utf-8').read()
          old = "            if (fileUris.size() > 1) {\n                intent.putExtra(Intent.EXTRA_STREAM, fileUris);\n"
          new = ("            if (fileUris.size() > 1) {\n"
                 "                intent.putParcelableArrayListExtra(Intent.EXTRA_STREAM, fileUris);\n"
                 "                ClipData multiClip = ClipData.newRawUri(\"\", fileUris.get(0));\n"
                 "                for (int k = 1; k < fileUris.size(); k++) { multiClip.addItem(new ClipData.Item(fileUris.get(k))); }\n"
                 "                intent.setClipData(multiClip);\n")
          assert t.count(old) == 1, 'SharePlugin: motif introuvable, correction non appliquee'
          t = t.replace(old, new)
          old2 = "                    if (type == null || filesList.size() > 1) {\n                        type = \"*/*\";\n                    }\n"
          new2 = ("                    if (type == null) {\n"
                  "                        type = \"*/*\";\n"
                  "                    } else if (filesList.size() > 1) {\n"
                  "                        for (int j = 0; j < filesList.size(); j++) {\n"
                  "                            String t2 = getMimeType((String) filesList.get(j));\n"
                  "                            if (t2 == null || !t2.equals(type)) { type = \"*/*\"; break; }\n"
                  "                        }\n"
                  "                    }\n")
          assert t.count(old2) == 1, 'SharePlugin: type MIME introuvable, correction non appliquee'
          t = t.replace(old2, new2)
          open(f, 'w', encoding='utf-8').write(t)
          print('Partage de plusieurs fichiers : correction appliquee')
          PYSHARE
          mkdir www
          cp ../appli.html www/index.html
          cp ../taxi-*.png www/
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.taxipro.chauffeur",
            "appName": "Taxi Pro",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "useLegacyBridge": true }
          }
          JSON
          npx cap add android

      - name: Icones, notification, permissions, signature
        run: |
          pip install pillow
          cd build/android/app/src/main
          python3 - <<'PY'
          from PIL import Image
          import os, re
          src = Image.open('../../../../../taxi-512.png').convert('RGBA')
          mask = Image.open('../../../../../taxi-maskable-512.png').convert('RGBA')
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          fg = {'mdpi':108,'hdpi':162,'xhdpi':216,'xxhdpi':324,'xxxhdpi':432}
          for d,s in sizes.items():
              p = 'res/mipmap-'+d
              os.makedirs(p, exist_ok=True)
              src.resize((s,s), Image.LANCZOS).save(p+'/ic_launcher.png')
              src.resize((s,s), Image.LANCZOS).save(p+'/ic_launcher_round.png')
              mask.resize((fg[d],fg[d]), Image.LANCZOS).save(p+'/ic_launcher_foreground.png')
          os.makedirs('res/drawable', exist_ok=True)
          open('res/drawable/ic_stat_gps.xml','w').write('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z"/></vector>''')
          m = open('AndroidManifest.xml').read()
          if 'ACCESS_BACKGROUND_LOCATION' not in m:
              m = m.replace('</manifest>', '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>')
          open('AndroidManifest.xml','w').write(m)
          g = '../../build.gradle'
          t = open(g).read()
          t = re.sub(r'versionCode \d+', 'versionCode '+os.environ.get('RUN','1'), t)
          sign = "android {\n    signingConfigs {\n        debug {\n            storeFile file(System.getenv('GITHUB_WORKSPACE') + '/taxi-pro.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n"
          assert "android {\n" in t
          t = t.replace("android {\n", sign, 1)
          open(g,'w').write(t)
          PY
        env:
          RUN: ${{ github.run_number }}

      - name: Construire l'APK
        run: |
          cd build
          npx cap sync android
          cd android
          chmod +x gradlew
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then ok=1; break; fi
            echo "Tentative $i echouee, nouvelle tentative dans 60 secondes"
            sleep 60
          done
          if [ "$ok" != 1 ]; then
            echo "Le telechargement de Gradle echoue : essai avec le Gradle deja installe sur la machine"
            gradle --version || true
            gradle assembleDebug --no-daemon && ok=1
          fi
          [ "$ok" = 1 ] || exit 1
          cp app/build/outputs/apk/debug/app-debug.apk ../../taxi-pro.apk

      - name: Verifier la signature de l'APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs taxi-pro.apk | tee sig.txt
          if grep -qi "38ce7048f2aaa16aeb572bcef4cd23b238885ec37ec667f725cd7bb4edaf7dc8" sig.txt; then
            echo "OK : l'APK est signe avec la cle stable taxi-pro.keystore."
          else
            echo "ERREUR : la signature n'est pas celle de taxi-pro.keystore."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: taxi-pro
          path: taxi-pro.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Taxi Pro APK ${{ github.run_number }}
          files: taxi-pro.apk
